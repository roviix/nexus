name: release

# 推一个 `v*` 标签就发一版：两平台构建、签名（有证书时）、生成清单，全部上传到 GitHub Release。
# 应用内更新器读的 `latest.json` 也在同一个 Release 里，通过
# `https://github.com/<owner>/<repo>/releases/latest/download/latest.json` 拿到最新一版。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer，必须与 Cargo/package/tauri.conf 一致"
        required: true
        type: string
      release_notes:
        description: "发布说明（可留空）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: 校验版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析并核对版本
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            version="${MANUAL_VERSION#v}"
            tag="v${version}"
          fi
          node scripts/check-release-version.mjs "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 回归测试发布清单生成
        run: node scripts/test-package-release.mjs

  build:
    name: 构建与签名 ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS universal
            platform: macos
          - os: windows-latest
            label: Windows x64
            platform: windows
    runs-on: ${{ matrix.os }}
    env:
      # updater 的签名密钥对是硬要求：没有它更新器无法验证来源。
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # updater 清单默认指向本仓库的 latest Release；fork 时改这个变量即可。
      TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT || format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) }}
      # 代码签名 / 公证证书是可选的：没配就出未签名包（用户首次打开需要手动放行）。
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装前端依赖
        run: npm ci
        working-directory: apps/desktop

      - name: 校验 updater 签名密钥
        shell: bash
        run: |
          for name in TAURI_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::缺少发布变量或 Secret：$name（用 \`npx tauri signer generate\` 生成一对）"
              exit 1
            fi
          done

      - name: 导入 Windows 代码签名证书（可选）
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "nexus-release.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          $certificate = $imported |
            Where-Object { $_.HasPrivateKey } |
            Select-Object -First 1
          if ($null -eq $certificate) {
            Write-Error "PFX 中没有可用于代码签名的私钥证书。"
          }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item $certificatePath -Force

      - name: 生成发布专用 Tauri 配置
        shell: bash
        run: node scripts/write-release-config.mjs "$RUNNER_TEMP/tauri.release.conf.json"

      - name: 构建 macOS（有证书时签名并公证）
        if: matrix.platform == 'macos'
        shell: bash
        working-directory: apps/desktop
        run: |
          # GitHub Actions 把未配置的 Secret 注成空字符串。Tauri 只要见到
          # APPLE_CERTIFICATE 这个变量就会 `security import`，空值报
          # `SecKeychainItemImport: One or more parameters passed to a function were not valid`，
          # 编译已经完成的 universal 包也打不出来。没配证书就清掉，出未签名包。
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            echo "没有 Apple 证书，打未签名包。"
          fi
          if [[ -z "${APPLE_ID:-}" ]]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build \
            --target universal-apple-darwin \
            --bundles app,dmg \
            --config "$RUNNER_TEMP/tauri.release.conf.json"

      - name: 构建 Windows（有证书时签名）
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          npx tauri build `
            --bundles nsis `
            --config "$env:RUNNER_TEMP\tauri.release.conf.json"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # 验证之前先上传：上一轮 dmg 已经打出来了，卡在 lipo 找二进制，结果产物跟着 job 没了。
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz
            target/**/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig

      - name: 验证 macOS 产物（签名、公证、双架构）
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # macos-latest 的 /bin/bash 是 3.2，没有 globstar。产物路径由
          # `--target universal-apple-darwin` 决定，直接写死。
          bundle_root=target/universal-apple-darwin/release/bundle
          app="$bundle_root/macos/Nexus.app"
          shopt -s nullglob
          dmgs=("$bundle_root"/dmg/*.dmg)
          updater_bundles=("$bundle_root"/macos/*.app.tar.gz)
          updater_signatures=("$bundle_root"/macos/*.app.tar.gz.sig)
          ls -la "$bundle_root/macos" "$bundle_root/dmg"
          ls -la "$app/Contents/MacOS" || true
          test -d "$app"
          test ${#dmgs[@]} -eq 1
          test ${#updater_bundles[@]} -eq 1
          test ${#updater_signatures[@]} -eq 1
          # 可执行文件不一定叫 Nexus（Cargo 包名是 nexus-desktop）；打完 dmg 后
          # .app 里有时会被掏空，那时从 updater 包里找。
          bin=""
          for f in "$app/Contents/MacOS"/*; do
            if [ -f "$f" ] && [ -x "$f" ]; then
              bin="$f"
              break
            fi
          done
          if [ -z "$bin" ]; then
            tmp="$(mktemp -d)"
            tar -xzf "${updater_bundles[0]}" -C "$tmp"
            bin="$(find "$tmp" -type f -path '*/Contents/MacOS/*' | head -1)"
          fi
          test -n "$bin"
          architectures="$(lipo -archs "$bin")"
          echo "binary: $bin"
          echo "architectures: $architectures"
          [[ "$architectures" == *arm64* && "$architectures" == *x86_64* ]]
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          else
            echo "::warning::没有配置 Apple 证书，这一版 macOS 包未签名。"
          fi

      - name: 验证 Windows 产物
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem target\release\bundle\nsis\*.exe -ErrorAction Stop
          )
          if ($installers.Count -ne 1) {
            Write-Error "NSIS EXE 应恰好有一个，实际 $($installers.Count) 个。"
          }
          if (-not (Test-Path "$($installers[0].FullName).sig")) {
            Write-Error "缺少 Tauri updater 签名。"
          }
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            $signature = Get-AuthenticodeSignature $installers[0].FullName
            if ($signature.Status -ne "Valid") {
              Write-Error "Windows 安装包签名无效：$($signature.StatusMessage)"
            }
          } else {
            Write-Warning "没有配置 Windows 证书，这一版安装包未签名。"
          }

  publish:
    name: 发布 GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
      SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input
          merge-multiple: true

      - name: 生成发布说明
        shell: bash
        run: |
          if [[ -n "$INPUT_RELEASE_NOTES" ]]; then
            printf '%s\n' "$INPUT_RELEASE_NOTES" > release-notes.md
          else
            printf 'Nexus %s\n' "$RELEASE_VERSION" > release-notes.md
          fi

      - name: 标准化产物并生成清单与校验和
        shell: bash
        run: |
          mode=--preview
          if [[ "$SIGNED" == "true" ]]; then mode=--verified-signed; fi
          node scripts/package-release.mjs \
            --input release-input \
            --output release-output \
            --version "$RELEASE_VERSION" \
            --notes-file release-notes.md \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            "$mode"
          (
            cd release-output
            sha256sum --check SHA256SUMS
            md5sum --check MD5SUMS
          )

      - name: 创建或更新 GitHub Release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-output/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-output/* \
              --target "$GITHUB_SHA" \
              --title "Nexus v${RELEASE_VERSION}" \
              --notes-file release-notes.md
          fi
