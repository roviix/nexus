name: 功能建议
description: 提一个新功能或行为改动
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新功能、行为改动、协议适配请**先开这个 issue 讨论**，谈拢了再动手写代码——
        免得你花时间实现的方案因为边界问题被退回（见
        [CONTRIBUTING](https://github.com/roviix/nexus/blob/main/CONTRIBUTING.md)）。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题是什么
      description: |
        请描述**问题**而不是你想要的功能。「我每次换号都要手动重启 Claude Code」
        比「请加一个自动重启开关」有用得多——前者可能有更好的解法。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      description: 有想法就写，没有也可以留空。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过哪些替代方案
      description: 包括「用现有功能绕过去」的办法，以及它为什么不够。

  - type: textarea
    id: extra
    attributes:
      label: 其它补充
      description: 参考实现、相关的上游接口文档、截图等。
