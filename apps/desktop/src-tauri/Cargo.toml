[package]
name = "nexus-desktop"
description = "Nexus —— Cursor 账号切换与管理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Tauri v2 把逻辑放 lib、入口留 main，这样 iOS/Android 目标能复用同一个 core。
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-core.workspace = true
nexus-store.workspace = true
nexus-cursor.workspace = true
nexus-switcher.workspace = true
nexus-accounts.workspace = true
nexus-chatgpt.workspace = true
nexus-grok.workspace = true
nexus-kiro.workspace = true
nexus-zcode.workspace = true
nexus-qoder.workspace = true
nexus-claude.workspace = true
nexus-antigravity.workspace = true
nexus-gemini-web.workspace = true
nexus-sand.workspace = true
nexus-crsr.workspace = true
nexus-grokbot.workspace = true
nexus-gateway.workspace = true
nexus-playground.workspace = true
nexus-connect.workspace = true
nexus-mesh.workspace = true

tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"

serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
log = "0.4.34"
# 设置页选目录。必须在主线程弹，走 `app_pick_dir`。
rfd = "0.15"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2"

[target."cfg(target_os = \"macos\")".dependencies]
core-foundation = "0.10"

[dev-dependencies]
# 权限探针的测试要在临时目录里造只读目录。
tempfile = "3"

[features]
# `tauri build` 会带上它。
custom-protocol = ["tauri/custom-protocol"]
# 真账号研究探针不会进入普通 CI / 桌面构建；手动运行时显式确认并打开。
live-probes = []

[[example]]
name = "grokbot_stream_probe"
path = "examples/grokbot_stream_probe.rs"
required-features = ["live-probes"]

[[example]]
name = "grokbot_box_agent_probe"
path = "examples/grokbot_box_agent_probe.rs"
required-features = ["live-probes"]
