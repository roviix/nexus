[package]
name = "nexus-sand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nexus-core.workspace = true
nexus-store.workspace = true
nexus-cursor.workspace = true
# Grok Bot 桥：Sand 补丁两种 Grok 鉴权形态的凭证都由它准备（descriptor / 直连凭证）。
nexus-grokbot.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
sha2.workspace = true
base64.workspace = true
tracing.workspace = true
# remote 的暂存镜像用它开临时目录；不是 dev-only 依赖。
tempfile = "3"
# 隧道：受监管的 ssh 子进程 + 帧多路复用到本机 TCP（remote::tunnel）。
tokio = { workspace = true, features = ["io-util", "net", "signal"] }

# 注意：**不依赖 nexus-switcher / nexus-accounts**。补丁改的是 Cursor 的代码，切号写的是
# Cursor 的数据，两者只共享 nexus-cursor 那层「定位 / 退出 / 启动」的基础能力（docs/SAND.md §3）。

[dev-dependencies]
nexus-cursor = { workspace = true, features = ["testing"] }
tempfile = "3"
